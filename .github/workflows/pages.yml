name: App veröffentlichen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Projektordner finden und Scanner-Bibliothek laden
        run: |
          F=$(find . -name setup.mjs -not -path "./node_modules/*" | head -n 1)
          if [ -z "$F" ]; then echo "FEHLER: setup.mjs wurde im Repository nicht gefunden"; ls -R | head -50; exit 1; fi
          DIR=$(dirname "$F")
          echo "Projektordner: $DIR"
          ls -la "$DIR"
          node "$F"
          mkdir _site
          cp -r "$DIR/index.html" "$DIR/style.css" "$DIR/manifest.webmanifest" "$DIR/sw.js" "$DIR/js" "$DIR/lib" "$DIR/icons" _site/
          ls -la _site _site/lib
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
